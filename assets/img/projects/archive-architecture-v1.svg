<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc"><title id="title">AI × Self system architecture</title><desc id="desc">Published work supplies passages, embeddings and a component catalogue. Search retrieves original passages. Ask writes cited answers. View selects sources and composes a structured narrative. The Gallery provides a shared Hall for browsing readings, composing new Views and exploring the archive map. Each selected View is rendered as an exhibition, with a corresponding article. D1 and R2 preserve narratives, source snapshots and media. Public saved Views join the Gallery collection.</desc><defs><linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eeeae2"/><stop offset=".5" stop-color="#f7f5f0"/><stop offset="1" stop-color="#e8e4dc"/></linearGradient><marker id="stone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#817362" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8f734b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="graphite-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#716e69" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="sage-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#647468" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mauve-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-rever