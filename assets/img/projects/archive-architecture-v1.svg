<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc"><title id="title">AI × Self system architecture</title><desc id="desc">Published work supplies passages, embeddings and a component catalogue. Search ranks original passages locally. Ask composes a cited answer. View selects original sources and composes one narrative that can be rendered as an article or an exhibition. Vue renders the article with live components. Three.js builds exhibition rooms, displays, lighting and routes. Both use a shared reading position. Cloudflare D1 and R2 preserve dated readings, source snapshots and media.</desc><defs><linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eeeae2"/><stop offset=".5" stop-color="#f7f5f0"/><stop offset="1" stop-color="#e8e4dc"/></linearGradient><marker id="stone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#817362" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8f734b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="graphite-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#716e69" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="sage-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#647468" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mauve-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#7c6876" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1600" height="1180" rx="0" fill="url(#ground)" stroke="none"/><text x="64" y="70" font-family="Arial" font-size="29" fill="#292824" >AI × Self</text><text x="1536" y="66" font-family="Arial" font-size="13" fill="#827b70" letter-spacing="1.4" text-anchor="end">SYSTEM ARCHITECTURE</text><text x="64" y="151" font-family="Arial" font-size="44" fill="#292824" >Original material, composed perspectives</text><text x="64" y="194" font-family="Arial" font-size="22" fill="#827b70" >A question can lead to a passage, an answer or a View to read and visit.</text><rect x="64" y="235" width="1472" height="120" rx="7" fill="#e8e2d7" stroke="none"/><g transform="translate(89 266) scale(1.2083333333333333)" stroke="#817362" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m3 8 9-5 9 5-9 5Z m-9 0 9 5 9-5m-18 5 9 5 9-5"/></g><text x="138" y="278" font-family="Arial" font-size="25" fill="#292824" >Published work and writing</text><text x="138" y="315" font-family="Arial" font-size="20" fill="#827b70" >Projects · research · photographs · fragments · interactions</text><path d="M793 294L880 294" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><text x="910" y="278" font-family="Arial" font-size="23" fill="#292824" >Prepared with each site build</text><text x="910" y="315" font-family="Arial" font-size="19" fill="#827b70" >Passages + embeddings + source and component catalogue</text><path d="M800 355v21H348v28" fill="none" stroke="#817362" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#stone-arrow)"/><path d="M800 376h309v28" fill="none" stroke="#8f734b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#gold-arrow)"/><path d="M348 376H40v339h20" fill="none" s