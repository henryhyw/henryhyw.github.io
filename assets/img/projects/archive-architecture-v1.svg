row)"/><rect x="710" y="620" width="802" height="71" rx="4" fill="#e3d6bb" stroke="none"/><text x="732" y="651" font-family="Arial" font-size="21" fill="#292824" >Question · sections · narrative · original sources</text><text x="732" y="678" font-family="Arial" font-size="17" fill="#8f734b" >Section introductions, afterword, illustration and narration</text><path d="M1110 717v24H880v27" fill="none" stroke="#8f734b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#gold-arrow)"/><path d="M1110 741h209v27" fill="none" stroke="#8f734b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#gold-arrow)"/><rect x="686" y="773" width="396" height="180" rx="5" fill="#fcfbf7" stroke="none"/><text x="710" y="812" font-family="Arial" font-size="28" fill="#292824" >Article</text><text x="1059" y="807" font-family="Arial" font-size="13" fill="#827b70" letter-spacing="1.4" text-anchor="end">VUE</text><text x="710" y="853" font-family="Arial" font-size="17" fill="#827b70" >Narrative and live source components</text><text x="710" y="881" font-family="Arial" font-size="17" fill="#827b70" >Reading, media and original interactions</text><rect x="1110" y="773" width="426" height="180" rx="5" fill="#fcfbf7" stroke="none"/><text x="1134" y="812" font-family="Arial" font-size="28" fill="#292824" >Exhibition</text><text x="1512" y="807" font-family="Arial" font-size="13" fill="#827b70" letter-spacing="1.4" text-anchor="end">THREE.JS</text><text x="1134" y="853" font-family="Arial" font-size="17" fill="#827b70" >Rooms, works and wall introductions</text><text x="1134" y="881" font-family="Arial" font-size="17" fill="#827b70" >Lighting, camera routes and audio guide</text><path d="M865 954v27h449v-23" fill="none" stroke="#8f734b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"  /><text x="1090" y="1004" font-family="Arial" font-size="17" fill="#8f734b" text-anchor="middle">Shared reading position</text><path d=