<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc"><title id="title">AI Personal Archive system architecture</title><desc id="desc">Original site material supports three independent experiences. Search combines lexical and semantic ranking in the browser and uses the same embeddings for a UMAP map. Ask prepares broad site context for a cited model answer. View selects from complete source and component descriptions, composes a narrative from selected full sources, validates the composition and renders original Vue components. D1 and R2 preserve the resulting reading and its source media for a permanent link.</desc><defs><linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eeeae2"/><stop offset=".5" stop-color="#f7f5f0"/><stop offset="1" stop-color="#e8e4dc"/></linearGradient><marker id="stone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#817362" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="gold-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8f734b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="graphite-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#716e69" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="sage-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#647468" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mauve-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-star