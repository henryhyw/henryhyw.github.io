  <meta name="description" content="Henry Wang studies Applied AI, researches learning and builds AI systems. An illustrated introduction to his work and life.">
  <title>Henry Wang</title>

<body>
  <main id="journey" aria-label="Henry Wang">
    <div class="stage" id="stage">
      <div class="copy" id="measure-copy" aria-hidden="true"></div>
      <div class="drawing-wrap" id="drawing-wrap">
        <svg id="drawing" viewBox="0 0 600 460" aria-hidden="true">

      </div>
      <svg id="letters" aria-hidden="true" fill="currentColor" fill-rule="evenodd"></svg>
      <div id="readable" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    </div>
  </main>
  <noscript><article class="no-script"><h1>Henry Wang</h1><p>I was born in Taiwan, grew up in Shanghai and now study Applied AI at the University of Hong Kong. I work on AI projects at PwC.</p><p>I study how people and AI systems learn. I build tools for writing and working with AI, and record my thoughts and feelings in Fragments. I like spending time by the sea.</p></article></noscript>
